<!doctype html>
<html lang="en">
	<head>
		<link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="me" href="https://mastodon.social/@loucyx" />
		<link rel="stylesheet" href="./style.css" />
		<link rel="thumb" href="https://lougpt.com/appicon.png" />
		<meta charset="UTF-8" />
		<meta
			content="Fastest and most honest Chatbot in the market"
			name="description"
		/>
		<meta
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
			name="viewport"
		/>
		<script src="./main.js" type="module" defer></script>
		<title>LouGPT</title>
	</head>
	<body>
		<form method="POST">
			<output name="chat" for="message"></output>
			<div class="input-container">
				<input autofocus id="message" name="message" placeholder="Ask anything" />
				<button type="submit" aria-label="Send">Send</button>
			</div>
		</form>
	</body>
</html>
